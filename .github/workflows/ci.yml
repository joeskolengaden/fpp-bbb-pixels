name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock FPP 5.4.1 sources (the patchers are tested against these, unmodified)
        uses: actions/checkout@v4
        with:
          repository: FalconChristmas/fpp
          ref: 5.4.1
          path: fpp-stock
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs php-cli g++ python3-pip
          pip install --quiet jsonschema
          curl -fsSL -o /tmp/pluginInfo.schema.json https://raw.githubusercontent.com/FalconChristmas/fpp-plugin-Template/master/pluginInfo.schema.json
      - name: Every check (shell, python, page code, plugin schema, SPI framing, guard, rules, patchers, leak scan)
        run: FPP_SRC="$PWD/fpp-stock" FBP_SCHEMA=/tmp/pluginInfo.schema.json bash scripts/check-all.sh
  compile-syntax:
    # Informational: the patched driver sources must at least parse as C++ against FPP's headers. The real build is the board's own (install.sh).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FalconChristmas/fpp
          ref: 5.4.1
          path: fpp-stock
      - name: Patch and syntax-check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libjsoncpp-dev libcurl4-openssl-dev libgraphicsmagick++1-dev libmicrohttpd-dev libzstd-dev
          cp fpp-stock/src/channeloutput/BBB48String.cpp /tmp/BBB48String.cpp
          cp fpp-stock/src/channeloutput/PixelString.cpp /tmp/PixelString.cpp
          python3 patch_bbb48string.py /tmp/BBB48String.cpp
          python3 patch_pixelstring.py /tmp/PixelString.cpp
          for f in BBB48String PixelString; do
            g++ -std=gnu++17 -fsyntax-only -Ifpp-stock/src -Ifpp-stock/src/channeloutput -I/usr/include/jsoncpp -include fpp-stock/src/fpp-pch.h /tmp/$f.cpp
          done
